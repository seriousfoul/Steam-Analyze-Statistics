<html>
    <head>
        <meta charset="utf-8">
        <title>Steam 遊戲統計與圖表視覺化 - 遊戲相關統計表</title>

        <!--  bootstrap 頁碼 樣式  -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
        
        <link href="{{ url_for('static', filename='css/index.css') }}" rel="stylesheet">
    </head>
    <body>

        <div id="Banner">
            <div class="logo">
                <a href="/"> <img src="/static/img/logo.png" ></a>
            </div>
            <span>Steam 遊戲統計與圖表視覺化</span>         
            <div class="steamlogo">
                <a href="https://store.steampowered.com/"> <img src="/static/img/New_Steam_Logo_with_name.jpg" ></a>
            </div>
        </div>
        
        <div id="menu">
            
            <ol>
                <li>
                    <a href="/top_Seller_Today">今日暢銷遊戲排行榜</a>
                </li>
                <li>
                    <a href="/most_Played_Today">今日遊玩人數排行榜</a>
                </li>
                <li>
                    <a href="/analyze_data">遊戲相關統計表</a>
                </li>     
                <li>
                    <a href="/api">串接資料</a>
                </li>                
            </ol>

        </div>
        <div id="content">
            <div class="cloud_space">
                <div class="cloud">
                    <h2>本月暢銷遊戲類型</h2>
                    <img src="static/img/{{month}}_topsellers_cloud.png" onerror="this.onerror=null; this.src='/static/img/waiting.png';" />
                </div>                
                <div class="cloud">
                    <h2>本月最多玩家遊戲類型</h2>
                    <img src="static/img/{{month}}_mostplay_cloud.png" onerror="this.onerror=null; this.src='/static/img/waiting.png';"/>
                </div>              
                <div class="cloud">
                    <h2>本月暢銷遊戲 - 上榜次數前5名排行走勢圖</h2>
                    <img src="static/img/{{month}} - TOPSELLERS - line.png" onerror="this.onerror=null; this.src='/static/img/waiting.png';"/>
                </div>    
                <div class="cloud">
                    <h2>本月最多玩家 - 上榜次數前5名排行走勢圖</h2>
                    <img src="static/img/{{month}} - MOSTPLAYED - line.png" onerror="this.onerror=null; this.src='/static/img/waiting.png';"/>
                </div>    
                <div class="cloud">
                    <h2>本月暢銷遊戲 - 前10名遊戲類型</h2>
                    <img src="static/img/{{month}} - TOPSELLERS(Type) - bar.png" onerror="this.onerror=null; this.src='/static/img/waiting.png';"/>
                </div>

                <div class="cloud">
                    <h2>本月最多玩家 - 前10名遊戲類型</h2>
                    <img src="static/img/{{month}} - MOSTPLAYED(Type) - bar.png" onerror="this.onerror=null; this.src='/static/img/waiting.png';"/>
                </div>
                <div class="cloud">
                    <h2>本月暢銷遊戲 - 費用類型比例</h2>
                    <img src="static/img/{{month}} - TOPSELLERS(Price) - pie.png" onerror="this.onerror=null; this.src='/static/img/waiting.png';"/>
                </div>
                <div class="cloud">
                    <h2>本月最多玩家 - 費用類型比例</h2>
                    <img src="static/img/{{month}} - MOSTPLAYED(Price) - pie.png" onerror="this.onerror=null; this.src='/static/img/waiting.png';"/>
                </div>
            </div>

        </div>
        <div style="clear: both;"></div>

        <div id="footer">© 2025 Valve Corporation. 版權所有。所有商標皆為各自所有權人在美國與其他國家 (地區) 之財產。</div>

    </body>

</html>
