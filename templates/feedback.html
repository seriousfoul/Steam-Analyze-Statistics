<html>
    <head>
        <meta charset="utf-8">
        <title>STEAM 遊戲資料蒐集 - 給予建議</title>

        <!--  bootstrap 頁碼 樣式  -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
        
        <link href="{{ url_for('static', filename='css/index.css') }}" rel="stylesheet">
    </head>
    <body>
        {% if success %}
		    <script>
			    alert("新增完成");
		    </script>
	    {% endif %}

        <div id="Banner">
            <div class="logo">
                <a href="/"> <img src="/static/img/logo.png" ></a>
            </div>
            <span>STEAM 遊戲資料蒐集</span> 
            <div class="steamlogo">
                <a href="https://store.steampowered.com/"> <img src="/static/img/New_Steam_Logo_with_name.jpg" ></a>
            </div>
        </div>
        
        <div id="menu">            
 
            <ol>
                <li>
                    <a href="/top_Seller_Today">今日暢銷遊戲排行榜</a>
                </li>
                <li>
                    <a href="/most_Played_Today">今日遊玩人數排行榜</a>
                </li>
                <li>
                    <a href="/analyze_data">遊戲相關統計表</a>
                </li>     
                <li>
                    <a href="/feedback">給予建議</a>
                </li>     
                <li>
                    <a href="/api">串接資料</a>
                </li>                
            </ol>

        </div>
        <div id="content">
            <div id="formdiv">
                <form action="" method="post" class="contact_form"> 
                    <div class="from-group">
                        <label>姓名：</label>
                        <input type="text" name="username" class="form-control" required/>
                    </div>
                    <div class="from-group">
                        <label>信箱：</label>
                        <input tpye="email" name="usermail" class="form-control" required  />
                    </div>
                    <div class="from-group">
                        <label>標題：</label>
                        <input type="text" name="title" class="form-control" required />
                    </div>
                    <div class="from-group">
                        <label>內容：</label>
                        <textarea rows="10" name="contant" class="form-control"></textarea>
                    </div>
                    <div class="from-group" style="text-align: right; ">
                        <br />
                        <button type="button" name="stn" class="btn btn-primary" >送出建議</button>
                    </div>
                    
                </form>
            </div>
            

        </div>	

        <div style="clear: both;"></div>

        <div id="footer">© 2025 Valve Corporation. 版權所有。所有商標皆為各自所有權人在美國與其他國家 (地區) 之財產。</div>

    </body>

</html>
